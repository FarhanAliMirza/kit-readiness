<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit Readiness</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="mark" aria-hidden="true">▦</span> Kit Readiness</div>
      <a href="http://127.0.0.1:8400/" target="_blank" rel="noopener">Open InvenTree ↗</a>
    </div>
  </header>
  <main>
    <div class="intro">
      <h1>Workshop kit planner</h1>
      <p>Check what you can assemble, where to find missing parts, and what to order.</p>
    </div>
    <form id="plan-form">
      <fieldset id="inputs" disabled>
        <div class="fields">
          <label>Kit<select id="kit" required></select></label>
          <label>Assembly location<select id="location" required></select></label>
          <label>Kit quantity<input id="kits" type="number" min="1" max="10000" value="30" required></label>
          <label>Needed by<input id="needed-by" type="date" value="2030-06-14" required></label>
        </div>
        <div class="actions">
          <button class="primary" type="submit" value="readiness">Check readiness</button>
          <button type="submit" value="transfer">Plan transfers</button>
          <button type="submit" value="purchase">Draft purchase list</button>
        </div>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite">Loading live inventory…</p>
    <section id="results" aria-label="Plan results" hidden>
      <div class="summary">
        <div>
          <h2 id="result-title"></h2>
          <p id="result-description"></p>
        </div>
        <span id="result-state"></span>
      </div>
      <div id="table-wrap" tabindex="0" role="region" aria-label="Component quantities"></div>
      <div id="details"></div>
      <details class="trace">
        <summary>Synapse tool calls</summary>
        <ol id="trace-list"></ol>
      </details>
    </section>
  </main>
</body>
</html>
